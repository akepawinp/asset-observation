[project]
name = "mean-reversion-grid-trading"
version = "0.1.0"
description = "Quantitative Mean-Reversion Analysis & Screening Pipeline for Grid Trading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hurst>=0.0.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
mean-reversion-grid-trading = "src.cli:main"
mr-grid = "src.cli:main"
